<!DOCTYPE html>
<html lang="fr">

<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Découvrez votre compatibilité amoureuse grâce à la numérologie.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Compatibilité & Guidance">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>Compatibilité & Guidance</title>
  <link rel="manifest" href="manifest.json">
  <!-- Kkiapay SDK for web payments - v=20260124 pour forcer le rafraîchissement -->
  <script src="https://cdn.kkiapay.me/k.js?v=20260124"></script>
  <!-- Production environment configuration (edit env_config.js for deployment) -->
  <script src="env_config.js"></script>

  <style>
    /* Custom branded splash screen — project teal theme */
    body {
      margin: 0;
      padding: 0;
      background: #142933;
      overflow: hidden;
    }

    #splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: linear-gradient(160deg, #0f2029 0%, #142933 40%, #1a3340 70%, #0d1e26 100%);
      z-index: 9999;
      transition: opacity 0.5s ease-out;
    }

    #splash-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }

    #splash-logo {
      width: 120px;
      height: 120px;
      border-radius: 24px;
      animation: pulse-glow 2s ease-in-out infinite;
    }

    #splash-title {
      margin-top: 28px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 22px;
      font-weight: 600;
      color: #F2E6C4;
      letter-spacing: 0.5px;
      text-align: center;
    }

    #splash-subtitle {
      margin-top: 8px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      color: rgba(178, 196, 204, 0.7);
      letter-spacing: 0.3px;
    }

    /* Progress bar */
    #splash-progress-wrap {
      margin-top: 40px;
      width: 220px;
      text-align: center;
    }

    #splash-progress-bar {
      width: 100%;
      height: 6px;
      background: rgba(20, 213, 194, 0.15);
      border-radius: 3px;
      overflow: hidden;
    }

    #splash-progress-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #14d5c2, #1af0db);
      border-radius: 3px;
      transition: width 0.3s ease-out;
    }

    #splash-percent {
      margin-top: 10px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      color: #14d5c2;
      font-weight: 600;
      letter-spacing: 1px;
    }

    #splash-message {
      margin-top: 6px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 12px;
      color: rgba(178, 196, 204, 0.6);
      letter-spacing: 0.3px;
    }

    @keyframes pulse-glow {

      0%,
      100% {
        filter: drop-shadow(0 0 12px rgba(20, 213, 194, 0.15));
        transform: scale(1);
      }

      50% {
        filter: drop-shadow(0 0 28px rgba(20, 213, 194, 0.45));
        transform: scale(1.03);
      }
    }

    /* Decorative star particles */
    .splash-star {
      position: absolute;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: rgba(20, 213, 194, 0.3);
      animation: twinkle 3s ease-in-out infinite;
    }

    .splash-star-1 {
      top: 12%;
      left: 18%;
      animation-delay: 0s;
    }

    .splash-star-2 {
      top: 25%;
      left: 75%;
      animation-delay: 0.8s;
    }

    .splash-star-3 {
      top: 60%;
      left: 10%;
      animation-delay: 1.5s;
    }

    .splash-star-4 {
      top: 70%;
      left: 85%;
      animation-delay: 0.3s;
    }

    .splash-star-5 {
      top: 40%;
      left: 90%;
      animation-delay: 2.1s;
    }

    .splash-star-6 {
      top: 85%;
      left: 30%;
      animation-delay: 1.2s;
    }

    .splash-star-7 {
      top: 15%;
      left: 55%;
      animation-delay: 0.6s;
    }

    .splash-star-8 {
      top: 50%;
      left: 5%;
      animation-delay: 1.8s;
    }

    @keyframes twinkle {

      0%,
      100% {
        opacity: 0.15;
      }

      50% {
        opacity: 0.7;
      }
    }
  </style>
</head>

<body>
  <!-- Custom branded splash screen -->
  <div id="splash-screen">
    <!-- Decorative stars -->
    <div class="splash-star splash-star-1"></div>
    <div class="splash-star splash-star-2"></div>
    <div class="splash-star splash-star-3"></div>
    <div class="splash-star splash-star-4"></div>
    <div class="splash-star splash-star-5"></div>
    <div class="splash-star splash-star-6"></div>
    <div class="splash-star splash-star-7"></div>
    <div class="splash-star splash-star-8"></div>

    <img id="splash-logo" src="icons/Icon-192.png" alt="Compatibilité & Guidance" />
    <div id="splash-title">Compatibilité & Guidance</div>
    <div id="splash-subtitle">par Growpeak Agence</div>
    <div id="splash-progress-wrap">
      <div id="splash-progress-bar">
        <div id="splash-progress-fill"></div>
      </div>
      <div id="splash-percent">0%</div>
      <div id="splash-message">Chargement de votre consultation...</div>
    </div>
  </div>

  <!-- Flutter bootstrap — handles engine loading automatically -->
  <script src="flutter_bootstrap.js" async></script>

  <script>
    // Fake progress bar — organic acceleration
    (function () {
      var fill = document.getElementById('splash-progress-fill');
      var pct = document.getElementById('splash-percent');
      var progress = 0;
      var done = false;

      function tick() {
        if (done) return;
        // Fast at first, slows as it approaches 90
        var speed;
        if (progress < 30) speed = 2.5 + Math.random() * 2;
        else if (progress < 60) speed = 1.5 + Math.random() * 1.5;
        else if (progress < 85) speed = 0.5 + Math.random() * 0.8;
        else speed = 0.1 + Math.random() * 0.2;

        progress = Math.min(progress + speed, 92);
        fill.style.width = progress + '%';
        pct.textContent = Math.round(progress) + '%';
        setTimeout(tick, 150 + Math.random() * 100);
      }
      tick();

      // Complete to 100% when Flutter is ready
      window.addEventListener('flutter-first-frame', function () {
        done = true;
        progress = 100;
        fill.style.width = '100%';
        pct.textContent = '100%';
        var splash = document.getElementById('splash-screen');
        if (splash) {
          setTimeout(function () {
            splash.classList.add('hidden');
            setTimeout(function () { splash.remove(); }, 500);
          }, 300);
        }
      });
    })();
  </script>
</body>

</html>
