org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true

# Fix cross-drive paths issue on Windows (project on E: vs Pub cache on C:)
# This forces plugins to be compiled as AAR archives with absolute paths
flutter.buildPluginsAsAar=true
